<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Python Hot Patch</title>
  <desc id="desc">A live CPython process receives a guarded pending callback and continues running without restart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#112743"/>
      <stop offset="1" stop-color="#0b3b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="48" r="180" fill="#38bdf8" opacity="0.07"/>
  <circle cx="106" cy="320" r="160" fill="#34d399" opacity="0.06"/>
  <path d="M0 296 C210 250 330 350 560 300 S970 235 1200 300" fill="none" stroke="#7dd3fc" stroke-opacity="0.10" stroke-width="2"/>

  <g transform="translate(72 63)">
    <rect width="198" height="198" rx="38" fill="#07101d" stroke="#7dd3fc" stroke-opacity="0.35"/>
    <circle cx="99" cy="99" r="68" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="12"/>
    <path d="M61 108c0-18 13-29 31-29h20c11 0 18-7 18-17 0-11-8-17-18-17H90c-10 0-17 7-17 17" fill="none" stroke="#7dd3fc" stroke-width="13" stroke-linecap="round"/>
    <path d="M137 90c0 18-13 29-31 29H86c-11 0-18 7-18 17 0 11 8 17 18 17h22c10 0 17-7 17-17" fill="none" stroke="#34d399" stroke-width="13" stroke-linecap="round"/>
    <circle cx="93" cy="59" r="3.5" fill="#08111f"/>
    <circle cx="105" cy="139" r="3.5" fill="#08111f"/>
  </g>

  <g transform="translate(322 78)">
    <text x="0" y="48" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="50" font-weight="700">Python Hot Patch</text>
    <text x="2" y="88" fill="#bae6fd" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20">Preserve live state. Patch at a safe point. Verify independently.</text>

    <g transform="translate(2 125)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <rect width="220" height="58" rx="14" fill="#091827" stroke="#7dd3fc" stroke-opacity="0.35"/>
      <circle cx="29" cy="29" r="8" fill="#38bdf8" filter="url(#glow)"/>
      <text x="49" y="35" fill="#e0f2fe">LIVE CPYTHON</text>

      <path d="M236 29h55" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="m284 21 10 8-10 8" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="308" width="232" height="58" rx="14" fill="#091827" stroke="#34d399" stroke-opacity="0.4"/>
      <path d="M334 20v18m-9-9h18" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
      <text x="356" y="35" fill="#d1fae5">PENDING CALL</text>

      <path d="M556 29h55" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="m604 21 10 8-10 8" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="628" width="168" height="58" rx="14" fill="#091827" stroke="#a7f3d0" stroke-opacity="0.4"/>
      <path d="m650 29 7 7 14-16" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="682" y="35" fill="#d1fae5">VERIFIED</text>
    </g>
  </g>

  <g transform="translate(324 287)" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
    <text x="0" y="0">CPython</text>
    <circle cx="76" cy="-5" r="2" fill="#475569"/>
    <text x="91" y="0">Py_AddPendingCall</text>
    <circle cx="240" cy="-5" r="2" fill="#475569"/>
    <text x="255" y="0">gdb</text>
    <circle cx="294" cy="-5" r="2" fill="#475569"/>
    <text x="309" y="0">Codex + Claude Code</text>
  </g>
</svg>
